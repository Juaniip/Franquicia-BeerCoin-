<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>BeerCoin — Tu Propia Franquicia de Cerveza Inteligente</title>
<meta name="description" content="BeerCoin: la primera franquicia de cerveza inteligente. Sistema de expendio por monedas, autoservicio y experiencia social. Armá tu modelo y pedí tu cotización." />
<link rel="icon" type="image/webp" href="assets/img/logo.webp" />
<link rel="preload" as="image" href="assets/img/logo.webp" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<nav class="navbar">
  <div class="brand">
    <img src="assets/img/logo.webp" alt="BeerCoin" />
    <div class="brand-name">BEERCOIN</div>
  </div>
  <button type="button" class="btn-pink" id="btn-invest">Invertir</button>
</nav>

<section class="hero">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="hero-inner">
    <h1>
      <span class="line1">TU PROPIO</span>
      <span class="line2">
        <img src="assets/img/logo.webp" alt="" />
        <span class="brand-gradient">BEERCOIN</span>
      </span>
    </h1>
    <p>La primera franquicia de cerveza inteligente.</p>
  </div>
</section>

<section class="info-section" id="info-blocks"></section>

<section class="builder" id="builder-section">
  <div class="builder-inner">
    <h2>Diseñá tu <span class="accent">Modelo</span></h2>
    <div class="builder-grid">
      <div>
        <h3 class="col-title"><span class="num">01.</span>Tipo de Modelo</h3>
        <div class="model-list" id="model-list"></div>
      </div>
      <div>
        <h3 class="col-title"><span class="num">02.</span>Características</h3>
        <div class="features-grid custom-scrollbar" id="features-grid"></div>
      </div>
    </div>
    <div class="generate-wrap">
      <button type="button" class="btn-generate" id="btn-generate">
        GENERAR MODELO
        <svg class="arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>
</section>

<div class="overlay" id="benefit-overlay" role="dialog" aria-modal="true" aria-label="Beneficios BeerCoin">
  <button type="button" class="overlay-close" id="benefit-close" aria-label="Saltear">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="benefit-seq" id="benefit-seq"></div>
</div>

<div class="preview-overlay" id="preview-overlay" role="dialog" aria-modal="true" aria-label="Tu modelo BeerCoin">
  <button type="button" class="preview-close" id="preview-close" aria-label="Cerrar">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="preview-inner">
    <h2>Tu Beercoin <span>Lista</span></h2>
    <div class="preview-grid">
      <div class="preview-media" id="preview-media"></div>
      <div>
        <div class="preview-features custom-scrollbar" id="preview-features"></div>
        <button type="button" class="btn-whatsapp" id="btn-whatsapp">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39c1.44.79 3.06 1.2 4.71 1.2h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0012.04 2m0 1.67c2.2 0 4.26.86 5.82 2.42a8.19 8.19 0 012.41 5.82c0 4.54-3.7 8.23-8.24 8.23-1.43 0-2.84-.37-4.07-1.08l-.29-.17-3.03.8.81-2.95-.19-.3a8.18 8.18 0 01-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m-4.7 4.61c-.16 0-.42.06-.64.3-.22.24-.85.83-.85 2.03s.87 2.36.99 2.52c.12.16 1.7 2.72 4.2 3.7 2.08.82 2.5.66 2.95.62.45-.04 1.46-.6 1.66-1.18.2-.58.2-1.07.14-1.18-.06-.1-.22-.16-.45-.28-.24-.12-1.46-.72-1.68-.8-.23-.08-.4-.12-.56.12-.16.24-.64.8-.79.97-.14.16-.29.18-.53.06-.24-.12-1.02-.38-1.95-1.2-.72-.64-1.2-1.43-1.35-1.67-.14-.24-.02-.37.1-.5.11-.1.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.56-1.36-.78-1.85-.2-.5-.42-.42-.56-.43z"/></svg>
          SOLICITAR COTIZACIÓN
        </button>
      </div>
    </div>
  </div>
</div>

<footer>
  <p class="brand">BEERCOIN GROUP</p>

</footer>
