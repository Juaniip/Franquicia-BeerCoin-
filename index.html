<style>
  :root{
    --pink:#FF007F;
    --pink-dark:#d9006c;
    --cream:#FFD1AB;
    --wa:#25D366;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:#000;
    color:#fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x:hidden;
  }
  ::selection{background:var(--pink); color:#fff;}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}

  .container{max-width:1152px; margin:0 auto; padding:0 1.5rem;}

  /* NAVBAR */
  .navbar{
    position:fixed; top:0; left:0; width:100%; z-index:50;
    display:flex; justify-content:space-between; align-items:center;
    padding:1rem 1.5rem;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.1);
  }
  .navbar .brand{display:flex; align-items:center; gap:.75rem;}
  .navbar img{height:40px; width:auto; filter:drop-shadow(0 0 8px var(--pink));}
  .navbar .brand-name{font-size:1.5rem; font-weight:900; letter-spacing:-0.03em; text-transform:uppercase;}
  .btn-pink{
    background:var(--pink); color:#fff; font-weight:700;
    padding:.6rem 1.6rem; border-radius:999px; border:none;
    transition:transform .2s, background .2s;
  }
  .btn-pink:hover{background:var(--pink-dark); transform:translateY(-1px);}

  /* HERO */
  .hero{
    min-height:100vh;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; padding:6rem 1rem 3rem; position:relative; overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(to top, #000, rgba(0,0,0,.4), rgba(0,0,0,.6));
    z-index:0;
  }
  .hero::after{
    content:""; position:absolute; top:50%; left:50%;
    width:min(900px, 140vw); height:min(900px, 140vw);
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,0,127,.28) 0%, rgba(255,0,127,.08) 40%, transparent 70%);
    filter:blur(10px); z-index:0; pointer-events:none;
  }
  .hero-inner{position:relative; z-index:1; max-width:68rem; width:100%;}
  .hero h1{
    font-size:clamp(3.4rem, 11vw, 8.5rem);
    font-weight:900; margin:0 0 2rem;
    display:flex; flex-direction:column; align-items:center; gap:1.2rem;
    line-height:0.98;
  }
  .hero h1 .line1{display:block; text-align:center; opacity:0; transform:translateY(45px); animation:heroIn .9s cubic-bezier(.16,1,.3,1) .15s forwards;}
  .hero h1 .line2{display:flex; align-items:center; justify-content:center; gap:1.2rem; flex-wrap:wrap; opacity:0; transform:translateY(45px); animation:heroIn .9s cubic-bezier(.16,1,.3,1) .45s forwards;}
  .hero h1 img{height:clamp(64px, 9vw, 130px); width:auto; filter:drop-shadow(0 0 35px var(--pink));}
  .brand-gradient{
    background:linear-gradient(90deg, var(--pink), #ff5eb3, var(--pink));
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-transform:uppercase; letter-spacing:-0.03em; font-weight:900;
    animation:gradientMove 4s linear infinite;
    text-shadow:0 0 60px rgba(255,0,127,.45);
  }
  @keyframes gradientMove{ to{ background-position:200% center; } }
  @keyframes heroIn{ to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ to{ opacity:1; } }
  .hero p{
    font-size:clamp(1.25rem,3vw,1.85rem); color:#d4d4d8; font-weight:300; font-style:italic; margin:0;
    opacity:0; animation:fadeIn 1s ease .9s forwards;
  }

  .fade-up{opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;}
  .fade-up.in{opacity:1; transform:translateY(0);}

  /* INFO BLOCKS */
  .info-section{padding:6rem 1.5rem; max-width:1152px; margin:0 auto; display:flex; flex-direction:column; gap:8rem;}
  .info-block{display:flex; align-items:center; gap:4rem; flex-wrap:wrap;}
  .info-block.right{flex-direction:row-reverse;}
  .info-media{
    flex:1 1 380px; aspect-ratio:16/9; background:#18181b;
    border-radius:40px; border:1px solid rgba(255,255,255,.05);
    display:flex; align-items:center; justify-content:center;
    color:#3f3f46; font-weight:900; font-size:3rem;
    overflow:hidden; position:relative;
  }
  .info-media img{width:100%; height:100%; object-fit:cover;}
  .info-text{flex:1 1 380px;}
  .info-block.right .info-text{text-align:right;}
  .info-text h2{font-size:clamp(2rem,4vw,3rem); font-weight:900; margin:0 0 1.5rem; text-transform:uppercase; letter-spacing:-0.03em; line-height:1.1;}
  .info-text p{font-size:1.15rem; color:#a1a1aa; font-weight:300; line-height:1.7; margin:0;}

  @media (max-width:768px){
    .info-block, .info-block.right{flex-direction:column; text-align:center;}
    .info-block.right .info-text{text-align:center;}
  }

  /* BUILDER */
  .builder{padding:6rem 1rem; background:#09090b; position:relative;}
  .builder::before{
    content:""; position:absolute; top:0; left:0; width:100%; height:1px;
    background:linear-gradient(90deg, transparent, var(--pink), transparent); opacity:.5;
  }
  .builder-inner{max-width:1152px; margin:0 auto; position:relative; z-index:1;}
  .builder h2{text-align:center; font-size:clamp(2rem,5vw,3rem); font-weight:900; text-transform:uppercase; margin:0 0 4rem;}
  .builder h2 span{color:var(--pink);}
  .builder-grid{display:grid; grid-template-columns:1fr; gap:3rem;}
  @media (min-width:1024px){ .builder-grid{grid-template-columns:1fr 1fr;} }
  .col-title{font-size:1.15rem; font-weight:800; text-transform:uppercase; letter-spacing:.15em; margin:0 0 1.5rem;}
  .col-title .num{color:var(--pink); margin-right:.5rem;}

  .model-list{display:flex; flex-direction:column; gap:1rem;}
  .model-card{
    width:100%; text-align:left; padding:1.4rem; border-radius:1rem;
    border:2px solid #27272a; background:#18181b; color:#fff;
    display:flex; align-items:center; gap:1.4rem; transition:all .2s;
  }
  .model-card:hover{border-color:#3f3f46;}
  .model-card.active{
    border-color:var(--pink); background:rgba(255,0,127,.1);
    box-shadow:0 0 20px rgba(255,0,127,.1);
  }
  .model-card .icon{color:#71717a; flex-shrink:0;}
  .model-card.active .icon{color:var(--pink);}
  .model-card .name{flex-grow:1; text-transform:uppercase; font-weight:800; font-size:1.05rem;}

  .features-grid{
    display:grid; grid-template-columns:1fr; gap:.75rem;
    max-height:500px; overflow-y:auto; padding-right:.5rem;
  }
  @media (min-width:640px){ .features-grid{grid-template-columns:1fr 1fr;} }
  .feature-item{
    padding:1rem 1.2rem; border-radius:.75rem; border:1px solid #27272a; color:#71717a;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:all .15s;
  }
  .feature-item:hover{background:#27272a;}
  .feature-item.selected{border-color:var(--pink); background:#18181b; color:#fff;}
  .feature-item.fixed{cursor:not-allowed; opacity:.9;}
  .feature-item .label{display:flex; align-items:center; gap:.5rem;}
  .feature-item .label span.name{font-size:.72rem; font-weight:800; text-transform:uppercase;}
  .feature-item .badge{
    font-size:.6rem; background:var(--pink); color:#fff; padding:.15rem .4rem; border-radius:.25rem; font-weight:900;
  }
  .feature-item .check{
    width:20px; height:20px; border-radius:6px; border:1px solid #3f3f46;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .feature-item.selected .check{background:var(--pink); border-color:var(--pink);}

  .generate-wrap{text-align:center; margin-top:5rem;}
  .btn-generate{
    background:#27272a; color:#71717a; font-weight:900; font-size:1.2rem;
    padding:1.4rem 4.5rem; border-radius:999px; border:none;
    display:inline-flex; align-items:center; gap:1rem; transition:all .2s; opacity:.5; cursor:not-allowed;
  }
  .btn-generate.active{
    background:var(--pink); color:#fff; opacity:1; cursor:pointer;
    box-shadow:0 0 40px rgba(255,0,127,.4);
  }
  .btn-generate.active:hover{transform:scale(1.05); background:var(--pink-dark);}
  .btn-generate .arrow{transition:transform .2s;}
  .btn-generate.active:hover .arrow{transform:translateX(6px);}

  /* OVERLAYS */
  .overlay{
    position:fixed; inset:0; z-index:150; background:rgba(0,0,0,.95);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    display:none; align-items:center; justify-content:center; padding:1.5rem; text-align:center;
    opacity:0; transition:opacity .3s;
  }
  .overlay.show{display:flex; opacity:1;}

  .benefit-seq{position:relative; width:100%; max-width:56rem;}
  .benefit-slide{display:none; flex-direction:column; align-items:center; opacity:0; transform:translateY(20px); transition:opacity .5s ease, transform .5s ease;}
  .benefit-slide.active{display:flex;}
  .benefit-slide.active.in{opacity:1; transform:translateY(0);}
  .benefit-slide .glow{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:320px; height:320px; background:rgba(255,209,171,.1); filter:blur(100px);
    border-radius:999px; z-index:-1;
  }
  .benefit-slide svg.sparkle{width:64px; height:64px; color:var(--cream); margin-bottom:2rem;}
  .benefit-slide h3{
    font-size:clamp(2.2rem,6vw,4.5rem); font-weight:900; color:var(--cream);
    text-transform:uppercase; letter-spacing:-0.03em; margin:0 0 2rem;
  }
  .benefit-slide p{font-size:clamp(1.1rem,2.5vw,1.4rem); color:#a1a1aa; font-weight:300; max-width:42rem; line-height:1.7; margin:0 0 3rem;}
  .btn-next{
    background:none; border:none; color:#71717a; display:flex; align-items:center; gap:.5rem;
    text-transform:uppercase; font-weight:900; letter-spacing:.15em; font-size:.85rem;
  }
  .btn-next:hover{color:var(--cream);}
  .progress-track{margin-top:4rem; width:12rem; height:4px; background:#27272a; margin-left:auto; margin-right:auto; border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; width:0; background:var(--cream); transition:width linear;}

  .benefit-final{display:none; flex-direction:column; align-items:center; opacity:0; transform:scale(.9); transition:opacity .5s ease, transform .5s ease;}
  .benefit-final.active{display:flex;}
  .benefit-final.active.in{opacity:1; transform:scale(1);}
  .benefit-final h3{font-size:clamp(2rem,5vw,3.6rem); font-weight:900; text-transform:uppercase; font-style:italic; margin:0 0 3rem;}
  .btn-configure{
    background:var(--pink); color:#fff; font-size:1.3rem; font-weight:900;
    padding:1.4rem 3.5rem; border-radius:999px; border:none;
    box-shadow:0 0 50px rgba(255,0,127,.4); transition:transform .2s;
  }
  .btn-configure:hover{transform:scale(1.05);}

  /* PREVIEW */
  .preview-overlay{
    position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.95);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    overflow-y:auto; display:none; opacity:0; transition:opacity .3s;
  }
  .preview-overlay.show{display:block; opacity:1;}
  .preview-close{
    position:fixed; top:2rem; right:2rem; z-index:110; background:none; border:none;
    color:#71717a; transition:all .2s;
  }
  .preview-close:hover{color:#fff; transform:rotate(90deg);}
  .preview-inner{min-height:100vh; max-width:80rem; margin:0 auto; padding:3rem 1.5rem; display:flex; flex-direction:column; justify-content:center;}
  .preview-inner h2{text-align:center; font-size:clamp(2.2rem,5vw,3.2rem); font-weight:900; text-transform:uppercase; font-style:italic; color:var(--pink); margin:0 0 3rem;}
  .preview-inner h2 span{color:#fff;}
  .preview-grid{display:grid; grid-template-columns:1fr; gap:4rem; align-items:center;}
  @media (min-width:1024px){ .preview-grid{grid-template-columns:1fr 1fr;} }
  .preview-media{
    position:relative; aspect-ratio:16/9; border-radius:40px; overflow:hidden;
    border:1px solid rgba(255,255,255,.1); background:#18181b;
    display:flex; align-items:center; justify-content:center; color:#3f3f46; font-weight:900;
  }
  .preview-media img{width:100%; height:100%; object-fit:cover;}
  .preview-features{
    display:grid; grid-template-columns:1fr 1fr; gap:.75rem;
    max-height:300px; overflow-y:auto; padding-right:1rem; font-weight:700;
  }
  .preview-feature{
    display:flex; align-items:center; gap:.75rem; background:rgba(255,255,255,.05);
    padding:1rem; border-radius:1rem; border:1px solid rgba(255,255,255,.05);
    font-weight:800; font-size:.65rem; text-transform:uppercase;
  }
  .btn-whatsapp{
    width:100%; background:var(--wa); color:#fff; font-weight:900; padding:1.4rem;
    border-radius:1.5rem; border:none; display:flex; align-items:center; justify-content:center; gap:1rem;
    box-shadow:0 10px 30px rgba(0,0,0,.3); font-size:1.2rem; margin-top:2rem; transition:transform .2s;
  }
  .btn-whatsapp:hover{transform:scale(1.05);}

  footer{padding:5rem 1.5rem; text-align:center; border-top:1px solid #18181b; background:#000;}
  footer .brand{color:var(--pink); font-weight:900; font-size:1.3rem; margin:0 0 .5rem; font-style:italic; letter-spacing:.15em; text-transform:uppercase;}
  footer .rights{color:#52525b; font-size:.7rem; letter-spacing:.4em; text-transform:uppercase; font-weight:700;}

  .custom-scrollbar::-webkit-scrollbar{width:6px;}
  .custom-scrollbar::-webkit-scrollbar-track{background:transparent;}
  .custom-scrollbar::-webkit-scrollbar-thumb{background:#3f3f46; border-radius:3px;}

  /* ============================================================
     RESPONSIVE — va al final a propósito para que gane siempre
     sobre las reglas de arriba, sin importar el orden de otras
     secciones del CSS. Cubre celulares Y tablets (hasta 1024px).
     ============================================================ */
  @media (max-width:1024px){
    .navbar{padding:.85rem 1.1rem;}
    .navbar img{height:34px;}
    .navbar .brand-name{font-size:1.2rem;}
    .btn-pink{padding:.55rem 1.3rem; font-size:.9rem;}

    .hero{min-height:auto; padding:6.5rem 1.25rem 3.5rem;}
    .hero::after{width:70vw; height:70vw; max-width:600px; max-height:600px;}
    .hero h1{font-size:clamp(2.6rem, 9vw, 4.5rem); margin-bottom:1.25rem; gap:.85rem;}
    .hero h1 img{height:clamp(42px, 8vw, 64px);}
    .hero p{font-size:clamp(1.05rem, 2.5vw, 1.3rem); max-width:28rem; margin:0 auto;}

    .info-section{padding:3.5rem 1.5rem; gap:3.5rem;}
    .info-block{gap:1.75rem;}
    .info-media{border-radius:24px;}
    .info-text h2{font-size:clamp(1.6rem, 5vw, 2.2rem); margin-bottom:.75rem;}
    .info-text p{font-size:1rem; line-height:1.6;}

    .builder{padding:3.5rem 1rem;}
    .builder h2{margin-bottom:2.25rem; font-size:clamp(1.7rem, 5vw, 2.2rem);}
    .builder-grid{gap:2.25rem;}
    .model-card{padding:1.1rem;}
    .generate-wrap{margin-top:3rem;}
    .btn-generate{padding:1.1rem 2rem; font-size:1rem; width:100%; justify-content:center;}

    footer{padding:3rem 1.25rem;}

    .benefit-slide h3{font-size:clamp(1.9rem,7vw,3rem); margin-bottom:1.25rem;}
    .benefit-slide p{font-size:1rem; margin-bottom:2rem;}
    .benefit-slide svg.sparkle{width:44px; height:44px; margin-bottom:1.25rem;}
    .progress-track{margin-top:2.5rem;}
    .benefit-final h3{font-size:clamp(1.7rem,6vw,2.6rem); margin-bottom:2rem;}
    .btn-configure{padding:1.1rem 2.5rem; font-size:1.05rem;}

    .preview-inner{padding:5.5rem 1.1rem 2rem;}
    .preview-inner h2{margin-bottom:2rem;}
    .preview-close{top:1rem; right:1rem;}
    .btn-whatsapp{padding:1.1rem; font-size:1rem;}
    .preview-features{grid-template-columns:1fr;}
  }

  @media (max-width:420px){
    .hero h1{font-size:clamp(2.2rem, 11vw, 2.8rem);}
    .info-text h2{font-size:1.5rem;}
    .features-grid{grid-template-columns:1fr;}
  }
</style>
</head>

    var mediaHtml = b.image ? '<img src="'+b.image+'" alt="'+b.title+'">' : '<span>RENDER</span>';
    block.innerHTML =
      '<div class="info-media">'+mediaHtml+'</div>'+
      '<div class="info-text"><h2>'+b.title+'</h2><p>'+b.desc+'</p></div>';
    infoSection.appendChild(block);
  });

  // --- Scroll reveal (con red de seguridad por si el navegador no coopera) ---
  var revealTargets = Array.prototype.slice.call(document.querySelectorAll('.fade-up'));

  function revealIfVisible(el){
    var rect = el.getBoundingClientRect();
    var vh = window.innerHeight || document.documentElement.clientHeight;
    // generoso a propósito: revela apenas el bloque se acerca al viewport,
    // para que nunca se vea como un hueco vacío mientras se termina de scrollear
    if (rect.top < vh * 1.15 && rect.bottom > 0) el.classList.add('in');
  }

  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting) entry.target.classList.add('in');
      });
    }, { threshold:0, rootMargin:'0px 0px 200px 0px' });
    revealTargets.forEach(function(el){ io.observe(el); });
  } else {
    revealTargets.forEach(revealIfVisible);
  }

  // chequeo inmediato por si algún bloque ya entra en pantalla al cargar,
  // y un par de reintentos por si las imágenes cambian el layout mientras cargan
  function revealPass(){ revealTargets.forEach(revealIfVisible); }
  revealPass();
  window.addEventListener('load', revealPass);
  window.addEventListener('scroll', revealPass, { passive:true });
  setTimeout(revealPass, 600);
  setTimeout(revealPass, 2000);

  // --- Render model list ---
  var modelList = document.getElementById('model-list');
  function renderModels(){
    modelList.innerHTML = '';
    MODELS.forEach(function(m){
      var card = document.createElement('button');
      card.className = 'model-card' + (state.selectedModel && state.selectedModel.id === m.id ? ' active' : '');
      card.innerHTML =
        '<span class="icon">'+ICONS[m.icon]+'</span>'+
        '<span class="name">'+m.name+'</span>';
      card.addEventListener('click', function(){
        state.selectedModel = m;
        renderModels();
        renderGenerateBtn();
      });
      modelList.appendChild(card);
    });
  }

  // --- Render features ---
  var featuresGrid = document.getElementById('features-grid');
  function renderFeatures(){
    featuresGrid.innerHTML = '';
    FEATURES.forEach(function(f){
      var isFixed = FIXED_FEATURES.indexOf(f) !== -1;
      var isSelected = state.selectedFeatures.indexOf(f) !== -1;
      var item = document.createElement('div');
      item.className = 'feature-item' + (isSelected ? ' selected' : '') + (isFixed ? ' fixed' : '');
      item.innerHTML =
        '<span class="label"><span class="name">'+f+'</span>'+(isFixed ? '<span class="badge">INCLUIDO</span>' : '')+'</span>'+
        '<span class="check">'+(isFixed ? ICONS.lock : (isSelected ? ICONS.checkSmall : '')) +'</span>';
      item.addEventListener('click', function(){
        if (isFixed) return;
        var idx = state.selectedFeatures.indexOf(f);
        if (idx === -1) state.selectedFeatures.push(f);
        else state.selectedFeatures.splice(idx, 1);
        renderFeatures();
      });
      featuresGrid.appendChild(item);
    });
  }

  // --- Generate button ---
  var btnGenerate = document.getElementById('btn-generate');
  function renderGenerateBtn(){
    if (state.selectedModel) btnGenerate.classList.add('active');
    else btnGenerate.classList.remove('active');
  }
  btnGenerate.addEventListener('click', function(){
    if (!state.selectedModel) return;
    openBenefitSequence();
  });

  renderModels();
  renderFeatures();
  renderGenerateBtn();

  // --- Benefit sequence popup ---
  var benefitOverlay = document.getElementById('benefit-overlay');
  var benefitSeq = document.getElementById('benefit-seq');
  var benefitTimer = null;

  function buildBenefitSequence(){
    var html = '';
    BENEFITS.forEach(function(b, i){
      html +=
        '<div class="benefit-slide" data-index="'+i+'">'+
          '<div class="glow"></div>'+
          ICONS.sparkles+
          '<h3>'+b.title+'</h3>'+
          '<p>'+b.desc+'</p>'+
          '<button class="btn-next" data-next>Siguiente '+ICONS.chevron+'</button>'+
          '<div class="progress-track"><div class="progress-fill" data-fill></div></div>'+
        '</div>';
    });
    html +=
      '<div class="benefit-final">'+
        '<h3>¡LISTO PARA EL ÉXITO!</h3>'+
        '<button class="btn-configure" id="btn-configure">CONFIGURAR MI MODELO</button>'+
      '</div>';
    benefitSeq.innerHTML = html;

    var nextBtns = benefitSeq.querySelectorAll('[data-next]');
    nextBtns.forEach(function(btn, i){
      btn.addEventListener('click', function(){ advanceBenefit(); });
    });
    document.getElementById('btn-configure').addEventListener('click', function(){
      closeBenefitSequence();
      openPreview();
    });
  }

  function showBenefitSlide(i){
    var slides = benefitSeq.querySelectorAll('.benefit-slide');
    var final = benefitSeq.querySelector('.benefit-final');
    slides.forEach(function(s){ s.classList.remove('active','in'); });
    final.classList.remove('active','in');

    if (i >= BENEFITS.length){
      final.classList.add('active');
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ final.classList.add('in'); }); });
      return;
    }
    var slide = slides[i];
    slide.classList.add('active');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ slide.classList.add('in'); }); });
    var fill = slide.querySelector('[data-fill]');
    fill.style.transition = 'none';
    fill.style.width = '0%';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        fill.style.transition = 'width 8s linear';
        fill.style.width = '100%';
      });
    });

    clearTimeout(benefitTimer);
    benefitTimer = setTimeout(advanceBenefit, 8000);
  }

  function advanceBenefit(){
    clearTimeout(benefitTimer);
    state.benefitIndex += 1;
    showBenefitSlide(state.benefitIndex);
  }

  function openBenefitSequence(){
    state.benefitIndex = 0;
    buildBenefitSequence();
    benefitOverlay.classList.add('show');
    showBenefitSlide(0);
  }

  function closeBenefitSequence(){
    clearTimeout(benefitTimer);
    benefitOverlay.classList.remove('show');
  }

  // --- Preview ---
  var previewOverlay = document.getElementById('preview-overlay');
  var previewMedia = document.getElementById('preview-media');
  var previewFeatures = document.getElementById('preview-features');
  var previewClose = document.getElementById('preview-close');
  var btnWhatsapp = document.getElementById('btn-whatsapp');

  function openPreview(){
    previewMedia.innerHTML = state.selectedModel.image
      ? '<img src="'+state.selectedModel.image+'" alt="'+state.selectedModel.name+'">'
      : '<div>RENDER NO DISPONIBLE</div>';

    previewFeatures.innerHTML = '';
    state.selectedFeatures.forEach(function(f){
      var isFixed = FIXED_FEATURES.indexOf(f) !== -1;
      var el = document.createElement('div');
      el.className = 'preview-feature';
      el.innerHTML = '<span style="color:var(--pink); display:flex;">'+(isFixed ? ICONS.lock : ICONS.checkSmall)+'</span>'+f;
      previewFeatures.appendChild(el);
    });

    previewOverlay.classList.add('show');
  }

  previewClose.addEventListener('click', function(){
    previewOverlay.classList.remove('show');
  });

  btnWhatsapp.addEventListener('click', function(){
    var text = "Hola Beercoin! Estoy interesado en adquirir la franquicia. He configurado mi modelo:\n\n" +
      "*Modelo:* " + state.selectedModel.name + "\n" +
      "*Adicionales:* " + (state.selectedFeatures.join(', ') || 'Ninguno') + ".\n\n" +
      "Quiero avanzar con la cotización.";
    var url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);
    window.open(url, '_blank');
  });

})();
</script>
</body>
</html>
